name: Build AltTab Unrestricted

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Test and build
        run: bash scripts/build_unrestricted.sh
      - name: Package corresponding source
        run: |
          mkdir -p build/unrestricted
          git archive --format=tar.gz -o build/unrestricted/corresponding-source.tar.gz HEAD
          git rev-parse HEAD > build/unrestricted/BUILD-COMMIT.txt
      - name: Upload build and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AltTab-Unrestricted-11.10.1-arm64
          path: |
            build/unrestricted/*.zip
            build/unrestricted/*.log
            build/unrestricted/*.md
            build/unrestricted/*.txt
            build/unrestricted/*.patch
            build/unrestricted/*.tar.gz
            build/unrestricted/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
